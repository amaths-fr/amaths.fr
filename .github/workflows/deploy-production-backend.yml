name: Deploy Backend

on:
  push:
    branches:
      - master
    paths:
      - "apps/platform/platform-backend/**"
      - "packages/sdk/**"
      - "packages/framework/backend-framework/**"
      - "packages/framework/sdk-toolkit/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: production-backend
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest
    environment: production-backend

    steps:
      - name: Debug SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "=== Key info ==="
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null \
            && echo "Private key is valid" \
            || echo "INVALID PRIVATE KEY"

          echo "=== SSH connection ==="
          ssh -vvv \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i ~/.ssh/id_ed25519 \
            debian@"$VPS_HOST" \
            'echo "SSH CONNECTION OK"; whoami; hostname'
    
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup repository
        uses: ./.github/actions/setup

      - name: Build backend
        working-directory: apps/platform/platform-backend
        run: pnpm build

      - name: Upload backend
        uses: burnett01/rsync-deployments@7.1.0
        with:
          switches: -avzr --delete
          path: apps/backend/dist/
          remote_path: /home/debian/www/backend
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: debian
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Restart backend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: debian
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cat > /home/debian/www/.env << 'EOF'
            NODE_ENV=production
            PORT=4444
            AIRTABLE_TOKEN=${{ secrets.AIRTABLE_TOKEN }}
            LANDING_PAGE_ORIGIN=https://amaths.fr
            EOF
            cd /home/debian/www
            pm2 restart amaths-backend --update-env || pm2 start backend/index.js --env-file=/home/debian/www/.env --name amaths-backend
            pm2 save